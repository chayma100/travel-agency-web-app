<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Utilisateur</title>
    <link rel="stylesheet" href="../css/espace_utilisateur.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="mainbox">
        <input type="checkbox" id="check">
        
        <!-- Menu hamburger -->
        <label for="check" class="btn_1">
            <i class="fas fa-bars"></i>
        </label>

        <!-- Sidebar -->
        <div class="sidebarmenu">
            <div class="logo">
                <a href="#">Espace Client</a>
            </div>

            <!-- Fermeture -->
            <label for="check" class="btn_2">
                <i class="fas fa-times"></i>
            </label>

            <ul class="lista">
                <li><a href="acceuil.html"><i class="fas fa-home"></i>Accueil</a></li>
                <li><a href="offres.html"><i class="fas fa-tags"></i>Offres</a></li>
                <li><a href="services.html"><i class="fas fa-sliders-h"></i>Services</a></li>
                <li><a href="../php/reservations_utilisateur.php"><i class="fas fa-calendar-plus"></i>Mes Réservations</a></li>
                <li><a href="contact.html"><i class="fas fa-phone"></i>Contact</a></li>
            </ul>

            <div class="socialmedia">
                <ul>
                    <li><i class="fab fa-facebook"></i></li>
                    <li><i class="fab fa-twitter"></i></li>
                    <li><i class="fab fa-instagram"></i></li>
                    <li><i class="fab fa-youtube"></i></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="content">
        <h1>Bienvenue sur votre espace</h1>
        <p>Réservez ou annulez vos voyages ici.</p>

        <!-- Formulaire de réservation -->
        <section>
            <h2>Faire une réservation</h2>
            <form action="../php/enregistrer_reservation.php" method="POST">
                <label for="destination">Destination</label>
                <input type="text" id="destination" name="destination" required>

                <label for="date">Date de départ</label>
                <input type="date" id="date" name="date" required>

                <label for="nb_personnes">Nombre de personnes</label>
                <input type="number" id="nb_personnes" name="nb_personnes" min="1" required>

                <button type="submit">Réserver</button>
            </form>
        </section>

        <!-- Annulation -->
        <section>
            <h2>Annuler une réservation</h2>
            <form action="../php/annuler_reservation.php" method="POST">
                <label for="id_reservation">ID de la réservation</label>
                <input type="text" id="id_reservation" name="id_reservation" required>

                <button type="submit" onclick="return confirm('Confirmer l\'annulation ?')">Annuler</button>
            </form>
        </section>
    </div>

</body>
</html>
