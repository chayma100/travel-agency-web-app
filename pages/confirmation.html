<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation - Agence Omra</title>
    <link rel="stylesheet" href="../css/paiement.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="payment-header">
        <h1><i class="fas fa-check-circle"></i> Confirmation</h1>
        <div id="success-message1" class="success-message1">
            <p>Votre paiement a été traité avec succès. Merci pour votre réservation !</p>
        </div>
    </header>

    <main class="payment-container">
        <section class="payment-step" id="step-3">
            <p>Nous vous remercions d'avoir choisi notre service. Vous allez recevoir une confirmation par email.</p>
        <button id="finish-btn">Terminé</button>
        <div id="message-container" style="display: none;"></div>
        </section>
    </main>
    <script src="../js/paiement.js"></script>
</body>
</html>
